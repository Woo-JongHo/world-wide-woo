name: 버그 보고
about: 재현 가능한 WWW 동작 오류를 보고합니다.
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 민감한 OAuth 토큰, API 키, credential 파일, raw quota 응답은 첨부하지 마세요.
  - type: textarea
