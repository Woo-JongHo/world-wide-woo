name: 기능 제안
about: WWW 제품 흐름이나 TUI 기능을 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 사용자 문제
      description: 구현 방식보다 현재 막히는 작업을 먼저 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 영향 영역
      options:
        - Conversation
        - Router · Model
        - Session · Flow
        - Usage HUD
        - Commit · Issue
        - Agent · Tool runtime
        - 기타
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 관찰하고 검증할 수 있는 조건을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 제품 또는 화면
      description: 그대로 복제할 요소와 WWW식으로 바꿀 요소를 구분해주세요.
