name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - name: Verify platform file/process boundary
        run: bun run release:gate -- --platform-check

  korean-result-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Korean result-sentence pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ -z "$PR_TITLE" || "$PR_TITLE" =~ ^(feat|fix|docs|refactor|perf|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?:\  ]]; then
            printf '%s\n' 'PR title must be a Korean problem, request, or result sentence without a Conventional Commits prefix'
            exit 1
          fi
